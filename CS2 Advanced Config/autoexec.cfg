//=============================================================================//
//                          CS2 AUTOEXEC + NULLBINDS                           //
//=============================================================================//
//                              by sLix1337                                    //
//                    steamcommunity.com/id/sLix7                              //
//=============================================================================//
// Settings only. Binds are in core/keys.cfg, behaviour in core/modules/.
//
// Every convar carries its accepted range and what it does. Ranges are the
// engine/menu ones; to confirm any of them in game, type the convar name alone
// in the console -- CS2 prints the current value, the default and the min/max.
//=============================================================================//

log_color "Console" "FF25FFFF"                 // console text colour, RRGGBBAA hex
echo ""
echo "  [AUTOEXEC] INITIALIZING CONFIGURATION... [AUTOEXEC]"
echo ""

//=============================================================================//
//                                    MOUSE                                    //
//=============================================================================//

m_yaw                                         ".022"                        // turn per mouse count. Valve default .022, no engine clamp

// Prediction
cl_predict_body_shot_fx                       "0"                           // 0/1  client-side body-hit effect before the server confirms
cl_predict_head_shot_fx                       "0"                           // 0/1  same for headshot effects
cl_predict_kill_ragdolls                      "0"                           // 0/1  ragdoll starts before the server confirms the kill
cl_predict_weapon_drop                        "0"                           // 0/1  drop animation plays before the server confirms
cl_predict_bomb_defusal                       "0"                           // 0/1  defuse completes client-side before the server says so

//=============================================================================//
//                                  SETTINGS                                   //
//=============================================================================//

// HUD
cl_weapon_selection_rarity_color              "1"                           // 0/1  colour the weapon-select strip by skin rarity
cl_hud_color                                  "3"                           // 0-12  HUD accent. 3 light blue. modules/hud.cfg repaints it per movement mode
cl_radar_rotate                               "0"                           // 0/1  0 = radar fixed north-up, 1 = rotates with your view
cl_hud_radar_scale                            "1.30"                        // HUD radar size. Menu slider range 0.80-1.30
hud_Scaling                                   "0.90"                        // whole-HUD scale. Menu slider range 0.50-0.95

// Crosshair defaults. The seven presets are in core/modules/crosshair.cfg.
cl_crosshairalpha                             "255"                         // 0-255  crosshair opacity. Needs cl_crosshairusealpha 1
cl_crosshaircolor_r                           "255"                         // 0-255  red channel. Only used when cl_crosshaircolor is 5
cl_crosshaircolor_g                           "255"                         // 0-255  green channel. Only used when cl_crosshaircolor is 5
cl_crosshaircolor_b                           "0"                           // 0-255  blue channel. Only used when cl_crosshaircolor is 5
cl_crosshair_t                                "0"                           // 0/1  1 drops the top segment (T shape)
cl_crosshairgap_useweaponvalue                "0"                           // 0/1  1 lets each weapon widen the gap on its own
cl_crosshair_friendly_warning                 "0"                           // 0/1  marks the crosshair when you aim at a teammate
cl_crosshair_recoil                           "0"                           // 0/1  1 makes the crosshair follow the recoil pattern

// Viewmodel
viewmodel_fov                                 "68"                          // 54-68  weapon-model FOV, not the world FOV
viewmodel_offset_x                            "0.5"                         // -2.5 to 2.5  right(+) / left(-). 0.5 or 1.5 both fine
viewmodel_offset_y                            "0.5"                         // -2 to 2  forward(+) / back(-)
viewmodel_offset_z                            "-2.0"                        // -2 to 2  up(+) / down(-)

// Audio
snd_headphone_eq                              "1"                           // headphone EQ profile. 0 off, 1 and 2 are the two curves
snd_mixahead                                  "0.025"                       // seconds of audio buffered ahead. Lower = less delay, more crackle risk
snd_spatialize_lerp                           "0.7"                         // 0-1  blend between full HRTF (0) and plain stereo (1)
SND_MENUMUSIC_VOLUME                          "0"                           // 0-1  main-menu music
snd_mute_mvp_music_live_players               "1"                           // 0/1  1 mutes MVP music while players are still alive
snd_autodetect_latency                        "1"                           // 0/1  let the engine pick the audio device latency
voice_always_sample_mic                       "0"                           // 0/1  1 keeps the mic sampling while you are not transmitting
snd_mute_losefocus                            "0"                           // 0/1  inverse of the menu option: 0 keeps audio when alt-tabbed

// Network
engine_low_latency_sleep_after_client_tick    "1"                           // 0/1  moves the frame sleep after the tick (Reflex-style)
cl_invites_only_friends                       "0"                           // 0/1  1 blocks lobby invites from non-friends
cl_invites_only_mainmenu                      "0"                           // 0/1  1 only shows invites while you sit in the menu
cl_join_advertise                             "2"                           // 0 nobody, 2 friends can join the game you are in
cl_interp                                     "0.015625"                    // interpolation seconds. 0.015625 = one 64-tick frame, 0.03125 = two
rate                                          "786432"                      // max bytes/sec from the server. 786432 is the CS2 maximum in the menu

//=============================================================================//
//                            PERFORMANCE / LATENCY                            //
//=============================================================================//

fps_max                                       "500"                         // in-game cap. 0 = uncapped. 500 sits above a ~475 avg, so near-uncapped
fps_max_ui                                    "500"                         // menu and loading-screen cap. 0 = uncapped
cl_disablefreezecam                           "1"                           // 0/1  1 skips the death cam and goes straight to spectating
r_drawtracers_firstperson                     "0"                           // 0/1  your own tracer rounds
cl_showhelp                                   "0"                           // 0/1  the pop-up hint boxes
cl_autohelp                                   "0"                           // 0/1  the automatic tutorial prompts
cl_showloadout                                "1"                           // 0/1  1 keeps the weapon strip on screen instead of fading it

//=============================================================================//
//                                    CORE                                     //
//=============================================================================//
// Must stay last. Recovery if movement breaks: KP_0 (panic), or KP_5 for stock W/A/S/D.
exec core/load
