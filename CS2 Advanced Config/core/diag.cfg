//=============================================================================//
//                CORE / DIAG  --  run with:  exec core/diag                   //
//=============================================================================//
// Answers one question: which layer failed to load?
//
// Every file defines one empty marker alias. This calls them in load order.
// An empty alias prints nothing, so a clean run is silent between the headers.
// The FIRST "Unknown command: v_<name>" you see names the file that never ran
// -- everything after it is meaningless.

echo ""
echo "  [diag] ============================================="
echo "  [diag] 0/7  can this map define aliases at all?"
alias v_alive "echo   [diag]      OK -- aliases work here"
v_alive
echo "  [diag]      no OK above -> WORKSHOP MAP. CS2 blocks 'alias'"
echo "  [diag]      there, so nothing below can have loaded."
echo "  [diag] ---------------------------------------------"
echo "  [diag] 1/7  core/reg.cfg          the verbs"
v_reg
echo "  [diag] 2/7  modules/hud.cfg       radar + mode colour"
v_hud
echo "  [diag] 3/7  modules/crosshair.cfg presets"
v_crosshair
echo "  [diag] 4/7  modules/weapons.cfg   fast drops"
v_weapons
echo "  [diag] 5/7  modules/viewmodel.cfg F7 cycle"
v_viewmodel
echo "  [diag] 6/7  modules/movement.cfg  null-binds"
v_movement
echo "  [diag] 7/7  core/keys.cfg         the binds"
v_keys
echo "  [diag] ---------------------------------------------"
echo "  [diag] no 'Unknown command' above = every layer loaded."
echo "  [diag] if 1/7 failed, core/load.cfg itself never ran."
echo "  [diag] ============================================="
echo ""
