//=============================================================================//
//            MODULE / HUD  --  radar boost, movement-mode colour              //
//=============================================================================//

alias slx_radar_near    "cl_radar_scale 0.35"
alias slx_radar_far     "cl_radar_scale 0.70"
alias +slx_radar_boost  "slx_radar_far"
alias -slx_radar_boost  "slx_radar_near"

// Console only: prints the server's tick timing, summary then detail.
alias slx_tick     "cl_ticktiming print summary;cl_ticktiming print detail"

//-----------------------------------------------------------------------------
// Movement-mode colour feedback.
//
// One layer, on purpose. Each colour alias is EITHER the convar write or
// empty -- hud_fb_off blanks all four, so every call site in movement.cfg
// becomes a no-op without knowing it, and hud_fb_on writes them back.
//
// The old shape pointed hud_paint -> hud_mode -> hud_c_* -> convar. That put
// the convar write five alias hops away from the KP_4 keypress and the colour
// never changed in game. Nothing here is more than one hop from a real
// command now.
//
// Cost of the flat shape: turning the feedback back ON does not repaint
// immediately, the colour catches up on the next mode change.
//-----------------------------------------------------------------------------

alias hud_c_null    "cl_hud_color 3"                                        // light blue, the autoexec default
alias hud_c_strict  "cl_hud_color 5"                                        // purple
alias hud_c_raw     "cl_hud_color 8"                                        // yellow
alias hud_c_stock   "cl_hud_color 1"                                        // mv_off: core/ is out of the input path

alias hud_fb_on     "alias hud_c_null cl_hud_color 3;alias hud_c_strict cl_hud_color 5;alias hud_c_raw cl_hud_color 8;alias hud_c_stock cl_hud_color 1;echo [hud] mode colour ON -- shows on the next mode change"
alias hud_fb_off    "alias hud_c_null ;alias hud_c_strict ;alias hud_c_raw ;alias hud_c_stock ;cl_hud_color 3;echo [hud] mode colour OFF"

alias hud_fb_toggle     hud_fb_toggle_off
alias hud_fb_toggle_off "hud_fb_off;alias hud_fb_toggle hud_fb_toggle_on"
alias hud_fb_toggle_on  "hud_fb_on;alias hud_fb_toggle hud_fb_toggle_off"

alias v_hud
