//=============================================================================//
//          MODULE / WEAPONS  --  FAST DROP ON 5 AND ~, QUICKSWITCH ON KP_6     //
//=============================================================================//
alias +slx_dropgun      "slot2;slot2"
alias -slx_dropgun      "drop;slot2"

alias +slx_dropbomb     "slot3;slot5"
alias -slx_dropbomb     "drop;slot1"

// Quickswitch. Press draws the knife, RELEASE goes back to the gun you had --
// the AWP and SSG then never play their re-scope animation. Hold does nothing;
// the release is the half that matters. slot3 and lastinv are not input
// commands, so this cannot hit the one-per-event rule.
alias +slx_quickswitch  "slot3"
alias -slx_quickswitch  "lastinv"

alias v_weapons
