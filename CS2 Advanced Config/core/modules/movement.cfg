//=============================================================================//
//                           NULL-BIND STATE MACHINE                           //
//=============================================================================//

alias +mv_w
alias -mv_w
alias +mv_s
alias -mv_s
alias +mv_a
alias -mv_a
alias +mv_d
alias -mv_d

// RAW now hands the keys to the engine with bind, instead of pointing the verb
// at +left / +right. bind is not an input command, so it is free under the rule
// below, and a real key release always reaches the button that pressed it --
// which is what used to latch the axis when you left raw with a key held.
//
// ONE input command each. CS2 rejects a second one in the same input event
// ("'left' can't follow 'right' in the same input event. Ignoring input.") and
// throws away the rest of the batch with it -- which is what killed the mode
// colour and the echo on KP_4. The axis write alone is enough: it is the only
// thing +left / +right ever moved.

//=============================================================================//
//                                LEFT / RIGHT                                 //
//=============================================================================//

alias mv_ad_0     "rightleft 0 0 0;  alias +mv_a mv_ad_a; alias -mv_a ;        alias +mv_d mv_ad_d; alias -mv_d "
alias mv_ad_a     "rightleft -1 0 0; alias +mv_a ;        alias -mv_a mv_ad_0; alias +mv_d mv_ad_ad;alias -mv_d "
alias mv_ad_d     "rightleft 1 0 0;  alias +mv_a mv_ad_da;alias -mv_a ;        alias +mv_d ;        alias -mv_d mv_ad_0"
alias mv_ad_ad    "rightleft 1 0 0;  alias +mv_a ;        alias -mv_a mv_ad_d; alias +mv_d ;        alias -mv_d mv_ad_a"
alias mv_ad_da    "rightleft -1 0 0; alias +mv_a ;        alias -mv_a mv_ad_d; alias +mv_d ;        alias -mv_d mv_ad_a"

alias mv_ad_n0   "rightleft 0 0 0;  alias +mv_a mv_ad_n_a; alias -mv_a ;           alias +mv_d mv_ad_n_d; alias -mv_d "
alias mv_ad_n_a  "rightleft -1 0 0; alias +mv_a ;          alias -mv_a mv_ad_n0;   alias +mv_d mv_ad_n_ad;alias -mv_d "
alias mv_ad_n_d  "rightleft 1 0 0;  alias +mv_a mv_ad_n_da;alias -mv_a ;           alias +mv_d ;          alias -mv_d mv_ad_n0"
alias mv_ad_n_a0 "rightleft 0 0 0;  alias +mv_a ;          alias -mv_a mv_ad_n0;   alias +mv_d mv_ad_n_ad;alias -mv_d "
alias mv_ad_n_d0 "rightleft 0 0 0;  alias +mv_a mv_ad_n_da;alias -mv_a ;           alias +mv_d ;          alias -mv_d mv_ad_n0"
alias mv_ad_n_ad "rightleft 1 0 0;  alias +mv_a ;          alias -mv_a mv_ad_n_d;  alias +mv_d ;          alias -mv_d mv_ad_n_a0"
alias mv_ad_n_da "rightleft -1 0 0; alias +mv_a ;          alias -mv_a mv_ad_n_d0; alias +mv_d ;          alias -mv_d mv_ad_n_a"

// Entering a mode writes NO axis: the mode aliases touch both axes and CS2
// allows one input command per event. -mv_a / -mv_d point at the real neutral
// state instead, so if a key was held across the switch its release does the
// zeroing -- one input command, in its own event, where it is legal.
alias mv_ad_0q      "alias +mv_a mv_ad_a;  alias -mv_a mv_ad_0; alias +mv_d mv_ad_d;  alias -mv_d mv_ad_0"
alias mv_ad_n0q     "alias +mv_a mv_ad_n_a;alias -mv_a mv_ad_n0;alias +mv_d mv_ad_n_d;alias -mv_d mv_ad_n0"

alias mv_rl_null    "bind a +slx_left;bind d +slx_right;mv_ad_0q"
alias mv_rl_strict  "bind a +slx_left;bind d +slx_right;mv_ad_n0q"
// RAW reproduces stock CS2 -- both keys held is a dead stop -- as a third
// table rather than by binding a/d to +left/+right. A bind swap cannot be
// undone safely: the key you were holding sends its release to the NEW
// command, the old axis write is never unwound, and you walk sideways until
// something else clears it.
alias mv_ad_r0    "rightleft 0 0 0;  alias +mv_a mv_ad_r_a; alias -mv_a ;         alias +mv_d mv_ad_r_d; alias -mv_d "
alias mv_ad_r_a   "rightleft -1 0 0; alias +mv_a ;          alias -mv_a mv_ad_r0; alias +mv_d mv_ad_r_ad;alias -mv_d "
alias mv_ad_r_d   "rightleft 1 0 0;  alias +mv_a mv_ad_r_ad;alias -mv_a ;         alias +mv_d ;          alias -mv_d mv_ad_r0"
alias mv_ad_r_ad  "rightleft 0 0 0;  alias +mv_a ;          alias -mv_a mv_ad_r_d;alias +mv_d ;          alias -mv_d mv_ad_r_a"
alias mv_ad_r0q   "alias +mv_a mv_ad_r_a;alias -mv_a mv_ad_r0;alias +mv_d mv_ad_r_d;alias -mv_d mv_ad_r0"

alias mv_rl_raw     "bind a +slx_left;bind d +slx_right;mv_ad_r0q"

//=============================================================================//
//                               FORWARD / BACK                                //
//=============================================================================//

alias mv_ws_0     "forwardback 0 0 0;  alias +mv_w mv_ws_w; alias -mv_w ;        alias +mv_s mv_ws_s; alias -mv_s "
alias mv_ws_w     "forwardback 1 0 0;  alias +mv_w ;        alias -mv_w mv_ws_0; alias +mv_s mv_ws_ws;alias -mv_s "
alias mv_ws_s     "forwardback -1 0 0; alias +mv_w mv_ws_sw;alias -mv_w ;        alias +mv_s ;        alias -mv_s mv_ws_0"
alias mv_ws_ws    "forwardback -1 0 0; alias +mv_w ;        alias -mv_w mv_ws_s; alias +mv_s ;        alias -mv_s mv_ws_w"
alias mv_ws_sw    "forwardback 1 0 0;  alias +mv_w ;        alias -mv_w mv_ws_s; alias +mv_s ;        alias -mv_s mv_ws_w"

alias mv_ws_n0   "forwardback 0 0 0;  alias +mv_w mv_ws_n_w; alias -mv_w ;           alias +mv_s mv_ws_n_s; alias -mv_s "
alias mv_ws_n_w  "forwardback 1 0 0;  alias +mv_w ;          alias -mv_w mv_ws_n0;   alias +mv_s mv_ws_n_ws;alias -mv_s "
alias mv_ws_n_s  "forwardback -1 0 0; alias +mv_w mv_ws_n_sw;alias -mv_w ;           alias +mv_s ;          alias -mv_s mv_ws_n0"
alias mv_ws_n_w0 "forwardback 0 0 0;  alias +mv_w ;          alias -mv_w mv_ws_n0;   alias +mv_s mv_ws_n_ws;alias -mv_s "
alias mv_ws_n_s0 "forwardback 0 0 0;  alias +mv_w mv_ws_n_sw;alias -mv_w ;           alias +mv_s ;          alias -mv_s mv_ws_n0"
alias mv_ws_n_ws "forwardback -1 0 0; alias +mv_w ;          alias -mv_w mv_ws_n_s;  alias +mv_s ;          alias -mv_s mv_ws_n_w0"
alias mv_ws_n_sw "forwardback 1 0 0;  alias +mv_w ;          alias -mv_w mv_ws_n_s0; alias +mv_s ;          alias -mv_s mv_ws_n_w"

alias mv_ws_0q      "alias +mv_w mv_ws_w;  alias -mv_w mv_ws_0; alias +mv_s mv_ws_s;  alias -mv_s mv_ws_0"
alias mv_ws_n0q     "alias +mv_w mv_ws_n_w;alias -mv_w mv_ws_n0;alias +mv_s mv_ws_n_s;alias -mv_s mv_ws_n0"

alias mv_fb_null    "bind w +slx_forward;bind s +slx_back;mv_ws_0q"
alias mv_fb_strict  "bind w +slx_forward;bind s +slx_back;mv_ws_n0q"
alias mv_ws_r0    "forwardback 0 0 0;  alias +mv_w mv_ws_r_w; alias -mv_w ;         alias +mv_s mv_ws_r_s; alias -mv_s "
alias mv_ws_r_w   "forwardback 1 0 0;  alias +mv_w ;          alias -mv_w mv_ws_r0; alias +mv_s mv_ws_r_ws;alias -mv_s "
alias mv_ws_r_s   "forwardback -1 0 0; alias +mv_w mv_ws_r_ws;alias -mv_w ;         alias +mv_s ;          alias -mv_s mv_ws_r0"
alias mv_ws_r_ws  "forwardback 0 0 0;  alias +mv_w ;          alias -mv_w mv_ws_r_s;alias +mv_s ;          alias -mv_s mv_ws_r_w"
alias mv_ws_r0q   "alias +mv_w mv_ws_r_w;alias -mv_w mv_ws_r0;alias +mv_s mv_ws_r_s;alias -mv_s mv_ws_r0"

alias mv_fb_raw     "bind w +slx_forward;bind s +slx_back;mv_ws_r0q"

//=============================================================================//
//                                    MODES                                    //
//=============================================================================//

alias mv_null    "mv_rl_null;mv_fb_null;alias mv_mode mv_null;hud_c_null;echo [mv] null-binds"
alias mv_strict  "mv_rl_strict;mv_fb_strict;alias mv_mode mv_strict;hud_c_strict;echo [mv] strict null -- release gives neutral"
alias mv_raw     "mv_rl_raw;mv_fb_raw;alias mv_mode mv_raw;hud_c_raw;echo [mv] raw"

alias mv_cycle   mv_cycle_2
alias mv_cycle_1 "mv_null;alias mv_cycle mv_cycle_2"
alias mv_cycle_2 "mv_strict;alias mv_cycle mv_cycle_3"
alias mv_cycle_3 "mv_raw;alias mv_cycle mv_cycle_1"

//=============================================================================//
//                               MASTER ON / OFF                               //
//=============================================================================//

alias mv_off     "bind w +forward;bind a +left;bind s +back;bind d +right;hud_c_stock;echo [mv] OFF -- stock CS2 movement"
alias mv_on      "bind w +slx_forward;bind a +slx_left;bind s +slx_back;bind d +slx_right;mv_mode;echo [mv] ON -- null-binds active"

alias mv_toggle     mv_toggle_off
alias mv_toggle_off "mv_off;alias mv_toggle mv_toggle_on"
alias mv_toggle_on  "mv_on;alias mv_toggle mv_toggle_off"

//=============================================================================//
//                              RESET & DEFAULTS                               //
//=============================================================================//

// KP_0 clears ONE thing per press, because one press is one input event and
// one input event carries one input command. Mash it: six presses cover
// everything that can latch, in the order they usually do.
alias mv_reset   mv_reset_1
alias mv_reset_1 "rightleft 0 0 0;alias mv_reset mv_reset_2;echo [panic] 1/6 strafe axis"
alias mv_reset_2 "forwardback 0 0 0;alias mv_reset mv_reset_3;echo [panic] 2/6 forward axis"
alias mv_reset_3 "-jump;alias mv_reset mv_reset_4;echo [panic] 3/6 jump"
alias mv_reset_4 "-duck;alias mv_reset mv_reset_5;echo [panic] 4/6 duck"
alias mv_reset_5 "-sprint;alias mv_reset mv_reset_6;echo [panic] 5/6 sprint"
alias mv_reset_6 "-use;alias mv_reset mv_reset_1;echo [panic] 6/6 use"

alias mv_mode    mv_null

alias v_movement

mv_null
