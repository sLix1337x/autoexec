//=============================================================================//
//              MODULE / CROSSHAIR  --  KP_7, KP_8, KP_9, LEFTARROW            //
//=============================================================================//
// Each preset repoints ch_cycle at the next one, so the cycle key and the
// direct key share one position: jump straight to the dot on KP_8 and KP_7
// continues from there, not from wherever it was before.
//
// Every preset also repoints ch_outline, for the same reason: land on a preset
// with the outline already off and the next KP_9 press turns it ON, instead of
// spending a press turning off what is already off.
//
// Outline thickness is 1.0 wherever the outline is drawn. 0.1 is reachable, but
// only as the middle step of the KP_9 cycle.

alias ch1 "cl_crosshairstyle 4;cl_crosshairsize 4.0;cl_crosshairthickness 1.0;cl_crosshairgap 0.0;cl_crosshair_drawoutline 0;cl_crosshairdot 0;echo [ch] 1/7 big cross;alias ch_cycle ch2;alias ch_outline ch_ol_thin"
alias ch2 "cl_crosshairstyle 4;cl_crosshairsize 0.0;cl_crosshairthickness 0.9;cl_crosshairgap -5;cl_crosshair_drawoutline 1;cl_crosshair_outlinethickness 1.0;cl_crosshairdot 1;echo [ch] 2/7 dot;alias ch_cycle ch3;alias ch_outline ch_ol_off"
alias ch3 "cl_crosshairstyle 4;cl_crosshairsize 4.0;cl_crosshairthickness 0.1;cl_crosshairgap -0.7;cl_crosshair_drawoutline 1;cl_crosshair_outlinethickness 1.0;cl_crosshairdot 0;echo [ch] 3/7 thin cross;alias ch_cycle ch4;alias ch_outline ch_ol_off"
alias ch4 "cl_crosshairstyle 4;cl_crosshairsize 6.0;cl_crosshairthickness 0.8;cl_crosshairgap 3.0;cl_crosshair_drawoutline 1;cl_crosshair_outlinethickness 1.0;cl_crosshairdot 0;echo [ch] 4/7 wide gap;alias ch_cycle ch5;alias ch_outline ch_ol_off"
alias ch5 "cl_crosshairstyle 4;cl_crosshairsize 3.5;cl_crosshairthickness 0.1;cl_crosshairgap -1.8;cl_crosshair_drawoutline 1;cl_crosshair_outlinethickness 1.0;cl_crosshairdot 0;echo [ch] 5/7 classic;alias ch_cycle ch6;alias ch_outline ch_ol_off"
alias ch6 "cl_crosshairstyle 4;cl_crosshairsize 1.0;cl_crosshairthickness 0.1;cl_crosshairgap -4;cl_crosshair_drawoutline 0;cl_crosshairdot 0;echo [ch] 6/7 tiny;alias ch_cycle ch7;alias ch_outline ch_ol_thin"
alias ch7 "cl_crosshairstyle 4;cl_crosshairsize 1.6;cl_crosshairthickness 0.1;cl_crosshairgap -1.8;cl_crosshair_drawoutline 1;cl_crosshair_outlinethickness 1.0;cl_crosshairdot 0;echo [ch] 7/7 small;alias ch_cycle ch1;alias ch_outline ch_ol_off"

alias ch_cycle   ch1
alias ch_dot     ch2

//-----------------------------------------------------------------------------
// KP_9 -- outline, three states: OFF -> 1.0 -> 0.1 -> OFF.
// Same self-advancing shape as every other cycle here.
//-----------------------------------------------------------------------------
alias ch_ol_off   "cl_crosshair_drawoutline 0;echo [ch] outline OFF;alias ch_outline ch_ol_thick"
alias ch_ol_thick "cl_crosshair_drawoutline 1;cl_crosshair_outlinethickness 1.0;echo [ch] outline 1.0;alias ch_outline ch_ol_thin"
alias ch_ol_thin  "cl_crosshair_drawoutline 1;cl_crosshair_outlinethickness 0.1;echo [ch] outline 0.1;alias ch_outline ch_ol_off"
alias ch_outline  ch_ol_off

alias ch_color   "cl_crosshaircolor_r 255;cl_crosshaircolor_g 255;toggle cl_crosshaircolor_b 0 255"

// The autoexec sets colour, alpha and the two warning convars. Style, size,
// thickness, gap, dot and outline come only from a preset, so one is applied
// here -- without it those six would come from CS2's saved settings instead.
// ch2 is the boot preset, the same one KP_8 jumps to, and it points ch_cycle at
// ch3 and ch_outline at ch_ol_off so the first press of either key moves.
ch2

alias v_crosshair
