//=============================================================================//
//                 MODULE / VIEWMODEL  --  F7 cycles all eight                 //
//=============================================================================//
// Each position repoints vm_cycle at the next one, so the cycle always
// continues from where you actually are. Same shared-pointer trick as the
// crosshair presets and the movement modes.
//
// Axes: x = how far right, y = forward / pulled back, z = height.
// z is -2.0 in seven of the eight, so the labels describe x and y. (The slx
// original's names were coined with y and z swapped; the values are identical,
// only these descriptions were corrected.)
//
// The autoexec's four viewmodel_* convars are position 1, so F7 starts by
// moving to 2 rather than re-applying where you already are.

alias vm_centre "viewmodel_fov 68;viewmodel_offset_x 0.5;viewmodel_offset_y 0.5;viewmodel_offset_z -2.0;echo [vm] 1/8 centre;alias vm_cycle vm_tuck"
alias vm_tuck   "viewmodel_fov 68;viewmodel_offset_x 1.0;viewmodel_offset_y -2.0;viewmodel_offset_z -2.0;echo [vm] 2/8 tuck   near, pulled back;alias vm_cycle vm_lift"
alias vm_lift   "viewmodel_fov 68;viewmodel_offset_x 1.0;viewmodel_offset_y 2.0;viewmodel_offset_z -2.0;echo [vm] 3/8 lift   near, forward;alias vm_cycle vm_low"
alias vm_low    "viewmodel_fov 68;viewmodel_offset_x 2.0;viewmodel_offset_y -2.0;viewmodel_offset_z -2.0;echo [vm] 4/8 low    right, pulled back;alias vm_cycle vm_right"
alias vm_right  "viewmodel_fov 68;viewmodel_offset_x 2.5;viewmodel_offset_y 0.0;viewmodel_offset_z -1.5;echo [vm] 5/8 right  right, raised;alias vm_cycle vm_far"
alias vm_far    "viewmodel_fov 68;viewmodel_offset_x 2.5;viewmodel_offset_y 0.0;viewmodel_offset_z -2.0;echo [vm] 6/8 far    right, centred;alias vm_cycle vm_high"
alias vm_high   "viewmodel_fov 68;viewmodel_offset_x 2.5;viewmodel_offset_y 2.0;viewmodel_offset_z -2.0;echo [vm] 7/8 high   far right, forward;alias vm_cycle vm_deep"
alias vm_deep   "viewmodel_fov 68;viewmodel_offset_x 2.5;viewmodel_offset_y -2.0;viewmodel_offset_z -2.0;echo [vm] 8/8 deep   far right, pulled back;alias vm_cycle vm_centre"

alias vm_cycle  vm_tuck

alias v_viewmodel
