//=============================================================================//
//                                  KEY BINDS                                  //
//=============================================================================//
// Keys point at +slx_* verbs (core/reg.cfg), never at game commands.
// Loads last, so binds have the final word.
//
// If core/ fails to load nothing is bound. Recovery, in console:
//   bind w +forward; bind a +left; bind s +back; bind d +right
//
// KEYPAD -- one row per category:
//
//   KP_7 ch cycle    KP_8 ch dot      KP_9 ch outline     crosshair
//   KP_4 mv mode     KP_5 mv on/off   KP_6 quickswitch    movement
//   KP_1 HUD colour  KP_2 --          KP_3 --             feature toggles
//   KP_0 PANIC  (double-width key, one job, findable without looking)
//
// F11 prints this map in game.
//=============================================================================//

//=============================================================================//
//              RECLAIM  --  keys the previous config left behind              //
//=============================================================================//
// CS2 persists every bind in cs2_user_keys.vcfg and re-applies it at start, so
// a key this file never names keeps whatever the last config put there. These
// still pointed at slx aliases that do not exist here, so the keys were dead.
// 6/7/8 go back to the CS2 defaults rather than to nothing.

bind "6"                                      "slot6"
bind "7"                                      "slot7"
bind "8"                                      "slot8"
// F5 slx_fps_cycle, F6 map de_dust2, KP_MINUS slx_mv_toggle, KP_PLUS
// +slx_peek -- one line, because check.py reads a repeated first token on
// separate lines as a convar set twice. F9 was slx_demo_toggle and is rebound
// below, so it is not in this list.
unbind "F5";unbind "F6";unbind "KP_MINUS";unbind "KP_PLUS"

// Combat
// Both mouse buttons are bound STRAIGHT to the game command, not to a verb.
// Smart defuse is dead (one input command per event, see HANDOFF 9.5) so there
// is no hook left to run, and the indirection cost spectator player-switch
// (mouse1 next / mouse2 previous) while dead.
bind "mouse1"                                 "+attack"
bind "mouse2"                                 "+attack2"
bind "e"                                      "+slx_use"
bind "scancode53"                             "+slx_dropbomb"              // fast bomb drop
bind "5"                                      "+slx_dropgun"               // secondary drop
bind "KP_6"                                   "+slx_quickswitch"           // knife on press, gun back on release

// Movement
bind "w"                                      "+slx_forward"
bind "a"                                      "+slx_left"
bind "s"                                      "+slx_back"
bind "d"                                      "+slx_right"
bind "mwheeldown"                             "+slx_wheeldown"             // jump
bind "mwheelup"                               "+slx_wheelup"               // next weapon
bind "scancode224"                            "+slx_duck"                  // CTRL
bind "SPACE"                                  "+slx_jump"
bind "KP_4"                                   "mv_cycle"                   // null -> strict -> raw
bind "KP_5"                                   "mv_toggle"                  // null-binds <-> stock CS2
bind "KP_0"                                   "mv_reset"                   // unstick movement + a held use

// Grenades
bind "scancode29"                             "+slx_decoy"                 // z
bind "scancode27"                             "+slx_smoke"                 // x
bind "scancode6"                              "+slx_he"                    // c
bind "scancode25"                             "+slx_molo"                  // v
bind "MOUSE5"                                 "+slx_flash"

// Radar
bind "N"                                      "incrementvar cl_radar_scale 0 1 0.25"
bind "M"                                      "+slx_radar_boost"           // hold: zoom out

// Crosshair
bind "KP_7"                                   "ch_cycle"                   // step through all 7
bind "KP_8"                                   "ch_dot"                     // straight to the dot
bind "KP_9"                                   "ch_outline"                 // outline: off -> 1.0 -> 0.1

// Feature toggles
bind "KP_1"                                   "hud_fb_toggle"              // HUD colour follows movement mode
bind "LEFTARROW"                              "ch_color"

// Viewmodel
bind "F7"                                     "vm_cycle"                   // step through all 8

// Help
bind "F11"                                    "exec core/help"             // print the key map

// Audio
bind "UPARROW"                                "volume 1"
bind "DOWNARROW"                              "volume 0.1"
bind "F3"                                     "voice_modenable_toggle"     // voice on/off
bind "MOUSE4"                                 "+voicerecord"               // push to talk

// Misc
bind "J"                                      "sensitivity 0.64"           // 1600 DPI
bind "scancode43"                             "teammenu"                   // TAB (56 is the / key -- confirmed in cs2_user_keys.vcfg)
bind "F4"                                     "toggleconsole"
bind "F9"                                     "slx_tick"                   // dump server tick timing to console
bind "h"                                      "switchhands"                // native CS2 toggle, left/right viewmodel
bind "f"                                      "+lookatweapon"              // weapon inspect

alias v_keys

//=============================================================================//
//                              LOAD COMPLETE                                  //
//=============================================================================//
// This file runs last, so this banner can only print if reg, every module and
// these binds all made it. In autoexec.cfg it printed even when core/ failed.

echo ""
echo "         #### #    ### #   #   #  #### #### ####"
echo "         #    #     #   # #   ##     #    #    #"
echo "         #### #     #    #     #   ###  ###   # "
echo "            # #     #   # #    #     #    #  #  "
echo "         #### #### ### #   #  ### #### ####  #  "
echo ""
echo "              [ OK ] SETTINGS APPLIED [ OK ]"
echo "      [ OK ] VERBS, MODULES AND BINDS LOADED [ OK ]"
echo "   [ OK ] NULLBINDS ARMED -- KP_4 SWITCHES MODE [ OK ]"
echo ""
echo "  [AUTOEXEC] CONFIGURATION LOADED SUCCESSFULLY! [AUTOEXEC]"
echo "              [STATUS] READY FOR GAME [STATUS]"
echo ""
