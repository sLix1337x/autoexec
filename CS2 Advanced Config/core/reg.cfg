//=============================================================================//
//                       CORE / REG  --  THE VERB LAYER                        //
//=============================================================================//

//=============================================================================//
//                                  MOVEMENT                                   //
//=============================================================================//

alias +slx_forward      "+mv_w"
alias -slx_forward      "-mv_w"
alias +slx_back         "+mv_s"
alias -slx_back         "-mv_s"
alias +slx_left         "+mv_a"
alias -slx_left         "-mv_a"
alias +slx_right        "+mv_d"
alias -slx_right        "-mv_d"

alias +slx_jump         "+jump"
alias -slx_jump         "-jump"
alias +slx_duck         "+duck"
alias -slx_duck         "-duck"

//=============================================================================//
//                                SCROLL WHEEL                                 //
//=============================================================================//

alias +slx_wheeldown    "+jump"
alias -slx_wheeldown    "-jump"
alias +slx_wheelup      "+slx_wheelup_act"
alias -slx_wheelup      "-slx_wheelup_act"
alias +slx_wheelup_act  "invnext"
alias -slx_wheelup_act  ""

//=============================================================================//
//                            COMBAT & INTERACTION                             //
//=============================================================================//

cl_scoreboard_mouse_enable_binding +attack2

alias +slx_use          "+use"
alias -slx_use          "-use"

//=============================================================================//
//                                  GRENADES                                   //
//=============================================================================//

alias +slx_he           "slot6"
alias -slx_he           ""
alias +slx_flash        "slot7"
alias -slx_flash        ""
alias +slx_smoke        "slot8"
alias -slx_smoke        ""
alias +slx_decoy        "slot9"
alias -slx_decoy        ""
alias +slx_molo         "slot10"
alias -slx_molo         ""

alias v_reg
