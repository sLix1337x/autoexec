//=============================================================================//
//                                 LOAD ORDER                                  //
//=============================================================================//
// The only place that knows the load order. CS2 does not scan directories --
// every file runs because this list names it.
//
// reg first: it declares the verbs every key routes through.
// movement LAST of the modules: it is the only one that runs something at load
// (mv_null), and that call reaches into hud.cfg for the mode colour.
// keys after everything, so binds have the final word.
//
// Broken? Run  exec core/diag  -- it names the first layer that failed.

exec core/reg

exec core/modules/hud
exec core/modules/crosshair
exec core/modules/weapons
exec core/modules/viewmodel
exec core/modules/movement

echo "  [CORE] reg + 5 modules loaded"

exec core/keys
