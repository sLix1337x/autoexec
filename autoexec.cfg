// ==========================================
// AUTOEXEC CONFIGURATION FOR CS2
// Created by sLix マ
// ==========================================

// --- BOMB DROP & VOICE TOGGLE ---
alias "+dropbomb" "slot3; slot5;"
alias "-dropbomb" "drop; slot1;"
bind "scancode53" "+dropbomb";
bind "ALT" toggle cl_crosshair_recoil true false;
bind "F1" "voice_modenable_toggle";

// --- RADAR ZOOM TOGGLE ---
bind "N" "incrementvar cl_radar_scale 0 1 0.25";

// --- GRENADE BINDS ---
bind scancode29 "slot9" // US English key name "z"; Decoy
bind scancode27 "slot8" // US English key name "x"; Smoke
bind scancode6 "slot6" // US English key name "c"; HE
bind scancode25 "slot10" // US English key name "v"; Molotov
bind "MOUSE5" "slot7"; // Flashbang


// --- NOCLIP ---
bind "J" "noclip"

// --- CROSSHAIR STYLE TOGGLE BINDS ---
// Use NumPad keys to quickly switch between predefined crosshair styles
bind kp_9 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.9; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -1.5; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0"
bind kp_3 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.7; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -2.2; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0"
bind kp_4 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.7; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -0.7; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0"
bind kp_5 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 0.0; toggle cl_crosshairthickness 0.9; toggle cl_crosshairgap -5; toggle cl_crosshair_drawoutline 0.1; toggle cl_crosshairdot 1"
bind kp_6 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 2.0; toggle cl_crosshairthickness 1.0; toggle cl_crosshairgap -1.8; toggle cl_crosshair_drawoutline 0.0; toggle cl_crosshairdot 0"
bind kp_0 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.6; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -1.8; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0"
bind kp_2 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.7; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -1.8; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0"
bind kp_1 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.0; toggle cl_crosshairthickness 1.0; toggle cl_crosshairgap -4; toggle cl_crosshair_drawoutline 0.0; toggle cl_crosshairdot 0"
bind kp_8 "toggle cl_crosshair_drawoutline 0"
bind kp_7 "toggle cl_crosshair_drawoutline 1"

// --- MOVEMENT BINDS ---
exec movement/setup
bind a +a
bind d +d
bind w +w
bind s +s

// --- JUMP (desubticked) ---
bind "mwheeldown" j
alias +j "+jump; +duck"
alias -j "-jump; -duck"
bind "space" +jump

// --- TELEMETRY & HUD SETTINGS ---
cl_hud_color 3 // Light Blue

// --- VIEWMODEL SETTINGS ---
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
viewmodel_presetpos 2

// --- AUDIO SETTINGS ---


// --- CONSOLE SETTINGS ---
con_enable "1"

// --- NULL BINDS ---
exec null_binds

// --- FINISH MESSAGE ---
echo =========================================
echo CONFIG LOADED SUCCESSFULLY
echo Created by "sLix マ"
echo =========================================
