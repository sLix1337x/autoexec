alias "toggle_crosshair_preset" "toggle_crosshair_preset_1"
alias "toggle_crosshair_preset_1" "cl_crosshairstyle 4; cl_crosshairsize 3.5; cl_crosshairthickness 1.0; cl_crosshairgap 28.0; cl_crosshair_drawoutline 1; cl_crosshairdot 1; alias toggle_crosshair_preset toggle_crosshair_preset_2"
alias "toggle_crosshair_preset_2" "cl_crosshairstyle 4; cl_crosshairsize 3.5; cl_crosshairthickness 1.0; cl_crosshairgap 70.0; cl_crosshair_drawoutline 1; cl_crosshairdot 1; alias toggle_crosshair_preset toggle_crosshair_preset_3"
alias "toggle_crosshair_preset_3" "cl_crosshairstyle 4; cl_crosshairsize 7.5; cl_crosshairthickness 1.0; cl_crosshairgap 50.0; cl_crosshair_drawoutline 1; cl_crosshairdot 1; alias toggle_crosshair_preset toggle_crosshair_preset_1"
bind "KP_9" "toggle_crosshair_preset";
bind kp_6 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 4.0; toggle cl_crosshairthickness 1.0; toggle cl_crosshairgap 0.0; toggle cl_crosshair_drawoutline 0.0; toggle cl_crosshairdot 0";
bind kp_5 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 0.0; toggle cl_crosshairthickness 0.9; toggle cl_crosshairgap -5; toggle cl_crosshair_drawoutline 0.1; toggle cl_crosshairdot 1";
bind kp_4 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 4.0; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -0.7; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0";
bind kp_3 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 6.0; toggle cl_crosshairthickness 0.8; toggle cl_crosshairgap 3.0; toggle cl_crosshair_drawoutline 1.2; toggle cl_crosshairdot 0";
bind kp_2 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 3.5; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -1.8; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0";
bind kp_1 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.0; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -4; toggle cl_crosshair_drawoutline 0.0; toggle cl_crosshairdot 0";
bind kp_0 "toggle cl_crosshairstyle 4; toggle cl_crosshairsize 1.6; toggle cl_crosshairthickness 0.1; toggle cl_crosshairgap -1.8; toggle cl_crosshair_drawoutline 1; toggle cl_crosshairdot 0";
alias "toggle_crosshair_outline" "toggle cl_crosshair_drawoutline 0 1"
bind "KP_7" "toggle_crosshair_outline";
alias "toggle_crosshair_color" "toggle cl_crosshaircolor_b 0 255"
bind "LEFTARROW" "toggle_crosshair_color";

