// --- BOMB DROP ---
alias "+dropbomb" "slot3; slot5;"
alias "-dropbomb" "drop; slot1;"
bind "scancode53" "+dropbomb";

// --- SECONDARY DROP ---
alias "+dropgun" "slot2; slot2;"
alias "-dropgun" "drop; slot2;"
bind "5" "+dropgun";

// --- VOICECHAT TOGGLE ---
bind "F1" "voice_modenable_toggle";
bind "F6" "callvote";

// --- RADAR ZOOM TOGGLE ---
bind "N" "incrementvar cl_radar_scale 0 1 0.25";
alias +vrboost "cl_radar_scale 0.7"
alias -vrboost "cl_radar_scale 0.35"
bind M +vrboost
cl_radar_rotate 0;
cl_hud_radar_scale "1.30";

// --- GRENADE BINDS ---
bind scancode29 "slot9"; // US English key name "z"; Decoy
bind scancode27 "slot8"; // US English key name "x"; Smoke
bind scancode6 "slot6"; // US English key name "c"; HE
bind scancode25 "slot10"; // US English key name "v"; Molotov
bind "MOUSE5" "slot7"; // Flashbang

// AUDIO KEYBINDS
bind "UPARROW" volume 1
bind "DOWNARROW" volume 0.1

// --- NOCLIP ---
bind "J" "noclip";

// --- CROSSHAIR/MENU ---
cl_crosshairalpha "255";
cl_crosshaircolor_r "255";
cl_crosshaircolor_g "255";
cl_crosshaircolor_b "0";
cl_crosshair_t "0";
cl_crosshairgap_useweaponvalue "0";
bind "ALT" toggle cl_crosshair_recoil true false;

sensitivity 1.20;
alias "toggle_low_sensitivity" "toggle_low_sensitivity_1"
alias "toggle_low_sensitivity_1" "sensitivity 0.64; alias toggle_low_sensitivity toggle_low_sensitivity_2"
alias "toggle_low_sensitivity_2" "sensitivity 0.50; alias toggle_low_sensitivity toggle_low_sensitivity_3"
alias "toggle_low_sensitivity_3" "sensitivity 0.625; alias toggle_low_sensitivity toggle_low_sensitivity_1"
bind "F13" "toggle_low_sensitivity"
alias "toggle_sensitivity" "toggle_sensitivity_1"
alias "toggle_sensitivity_1" "sensitivity 1.28; alias toggle_sensitivity toggle_sensitivity_2"
alias "toggle_sensitivity_2" "sensitivity 1.20; alias toggle_sensitivity toggle_sensitivity_3"
alias "toggle_sensitivity_3" "sensitivity 1.10; alias toggle_sensitivity toggle_sensitivity_1"
bind "RIGHTARROW" "toggle_sensitivity"
bind scancode56 "teammenu"

// --- CROSSHAIR STYLE TOGGLE BINDS ---
