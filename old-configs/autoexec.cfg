alias +jump_ "exec "+jump"
alias -jump_ "exec "-jump"
bind "mwheeldown" "+jump_"
bind scancode44 "+j"; // US English key name "SPACE"
bind scancode224 "+duck"; // US English key name "CTRL"

// --- TELEMETRY & HUD SETTINGS ---
cl_weapon_selection_rarity_color "1"
cl_hud_color 3; // Light Blue
hud_Scaling "0.90";

// --- VIEWMODEL SETTINGS ---
viewmodel_fov 68;
viewmodel_offset_x 0.5; // 0.5 or 1.5
viewmodel_offset_y 0.5;
viewmodel_offset_z -2.0;
alias "toggle_viewmodel" "toggle_viewmodel_1"
alias "toggle_viewmodel_1" "viewmodel_offset_y 1.5; viewmodel_offset_x -2.5; viewmodel_offset_z -2.0; alias toggle_viewmodel toggle_viewmodel_2"
alias "toggle_viewmodel_2" "viewmodel_offset_y 1.0; viewmodel_offset_z -2.0; viewmodel_offset_x 1.0; alias toggle_viewmodel toggle_viewmodel_1"
bind "F7" "toggle_viewmodel";
bind "F8" "viewmodel_offset_y 0.0; viewmodel_offset_z -1.5; viewmodel_offset_x 2.5";
bind "F9" "viewmodel_offset_y 2.0; viewmodel_offset_z -2.0; viewmodel_offset_x 2.0";
bind "F10" "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y -2.0; viewmodel_offset_z -2.0;";
alias "toggle_viewmodel_f11" "toggle_viewmodel_f11_1"
alias "toggle_viewmodel_f11_1" "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y 0.0; viewmodel_offset_z -2.5; alias toggle_viewmodel_f11 toggle_viewmodel_f11_2"
alias "toggle_viewmodel_f11_2" "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y 2.0; viewmodel_offset_z -2.0; alias toggle_viewmodel_f11 toggle_viewmodel_f11_1"
bind "F11" "toggle_viewmodel_f11";

